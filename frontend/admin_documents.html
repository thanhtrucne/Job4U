<!doctype html><html lang="vi"><meta charset="utf-8"><title>Duyệt giấy tờ</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><body class="container py-5"><h1 class="h3">Admin — giấy tờ chờ duyệt</h1><div id="rows"></div><script src="/static/js/auth.js"></script><script>const H=()=>({Authorization:'Bearer '+Auth.getToken()});async function load(){let r=await fetch('/api/documents/admin/pending',{headers:H()}),a=await r.json();rows.innerHTML=(a||[]).map(x=>`<div class="border rounded p-3 mb-2"><strong>${x.doc_type}</strong> · người dùng #${x.user_id}<br><a target="_blank" href="#" onclick="viewDoc(${x.id});return false">Xem file</a><button class="btn btn-sm btn-success ms-2" onclick="review(${x.id},'verified')">Duyệt</button><button class="btn btn-sm btn-danger ms-2" onclick="review(${x.id},'rejected')">Từ chối</button></div>`).join('')||'Không có giấy tờ chờ duyệt.'}async function viewDoc(id){let d=await(await fetch('/api/documents/admin/'+id+'/download',{headers:H()})).json();open(d.url,'_blank')}async function review(id,decision){let f=new FormData();f.append('decision',decision);if(decision==='rejected'){let reason=prompt('Lý do từ chối:');if(!reason)return;f.append('rejection_reason',reason)}let r=await fetch('/api/documents/admin/'+id,{method:'PUT',headers:H(),body:f});if(!r.ok)alert((await r.json()).detail);load()}load()</script></body></html>
