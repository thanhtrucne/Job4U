<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cẩm nang nghề nghiệp | Job4U</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet"><link href="/static/css/bootstrap.min.css" rel="stylesheet"><link href="/static/css/style_jobtop.css" rel="stylesheet"><link href="/static/css/site_navbar.css?v=20260903-2" rel="stylesheet"><style>body{font-family:Inter;background:#f6f8f7;color:#1b382f}.article{max-width:850px;margin:auto;background:#fff;border-radius:18px;padding:clamp(20px,5vw,55px);box-shadow:0 7px 26px #173b3210}.cover{width:100%;max-height:420px;object-fit:cover;border-radius:13px}.content{line-height:1.85;font-size:16px}.content img{max-width:100%;height:auto}.related-card{background:#fff;border:1px solid #e0eee7;border-radius:12px;padding:16px;height:100%}.tag{background:#e7f7ef;color:#08734f;border-radius:99px;padding:5px 9px;font-size:12px}</style></head>
<body>
  <div id="site-navbar"></div>
  <main class="container py-5"><article id="article" class="article">Đang tải bài viết…</article><section class="mt-4"><h2 class="h5 fw-bold mb-3">Bài viết liên quan</h2><div id="related" class="row g-3"></div></section></main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script><script src="/static/js/site_navbar.js?v=20260903-2"></script><script src="/static/js/auth.js?v=20260904-1"></script><script>
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const slug=new URLSearchParams(location.search).get('slug');
  async function load(){try{const r=await fetch('/api/career-guides/'+encodeURIComponent(slug)),d=await r.json();if(!r.ok)throw Error(d.detail);const g=d.guide;document.title=g.title+' | Job4U';article.innerHTML=`${g.thumbnail_url?`<img class="cover mb-4" src="${esc(g.thumbnail_url)}" alt="">`:''}<div class="small text-success fw-bold mb-2">${esc(g.category.name)}</div><h1 class="display-6 fw-bold">${esc(g.title)}</h1><div class="text-muted small mb-4">${esc(g.author)} · ${new Date(g.created_at).toLocaleDateString('vi-VN')} · <i class="fa fa-eye"></i> ${g.view_count}</div><p class="lead">${esc(g.summary)}</p><div class="d-flex gap-2 mb-4">${g.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div><div class="content">${g.content}</div><hr><div class="d-flex gap-2"><button id="save" class="btn btn-success"><i class="fa fa-bookmark me-1"></i>Lưu bài viết</button><button id="share" class="btn btn-outline-success"><i class="fa fa-share-alt me-1"></i>Chia sẻ</button></div>`;related.innerHTML=d.related.map(x=>`<div class="col-md-4"><a class="related-card d-block text-decoration-none text-dark" href="/static/career_guide_detail.html?slug=${encodeURIComponent(x.slug)}"><small class="text-success">${esc(x.category.name)}</small><strong class="d-block mt-1">${esc(x.title)}</strong></a></div>`).join('');share.onclick=()=>navigator.share?navigator.share({title:g.title,url:location.href}):navigator.clipboard.writeText(location.href).then(()=>alert('Đã sao chép liên kết.'));save.onclick=async()=>{const token=Auth.getToken();if(!token)return location.assign('/static/login.html?next='+encodeURIComponent(location.pathname+location.search));const x=await fetch('/api/career-guides/'+g.id+'/save',{method:'POST',headers:{Authorization:'Bearer '+token}}),a=await x.json();if(!x.ok)return alert(a.detail||'Không thể lưu');save.innerHTML=a.saved?'<i class="fa fa-bookmark me-1"></i>Đã lưu':'<i class="fa fa-bookmark me-1"></i>Lưu bài viết'}}catch(e){article.textContent=e.message}}load();
  </script>
</body></html>
