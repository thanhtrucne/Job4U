<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập — Job4U</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Inter:wght@700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
  <link href="/static/css/bootstrap.min.css" rel="stylesheet"><link href="/static/css/style_jobtop.css" rel="stylesheet">
</head>
<body><div class="container-xxl bg-white p-0 min-vh-100">
  <nav class="navbar navbar-expand-lg bg-white navbar-light shadow sticky-top p-0">
    <a href="/" class="navbar-brand d-flex align-items-center text-center py-0 px-4 px-lg-5"><h1 class="m-0 text-primary">Job4U</h1></a>
    <div class="navbar-nav ms-auto p-3 p-lg-0"><a href="/" class="nav-item nav-link">Trang chủ</a><a href="/static/jobs.html" class="nav-item nav-link">Việc làm</a></div>
    <div id="nav-auth-area" class="d-none"></div>
  </nav>
  <main class="container py-5"><div class="row justify-content-center"><div class="col-lg-5 col-md-7">
    <div class="text-center mb-4"><span class="d-inline-flex align-items-center justify-content-center bg-primary rounded-circle text-white" style="width:56px;height:56px"><i class="fa fa-sign-in-alt fa-lg"></i></span><h2 class="mt-3 mb-1">Chào mừng trở lại</h2><p class="text-muted">Đăng nhập để quản lý hồ sơ và ứng tuyển.</p></div>
    <div class="card border-0 shadow-sm"><div class="card-body p-4 p-md-5"><div id="notice" class="alert d-none" role="alert"></div>
      <form id="login-form" novalidate>
        <div class="mb-3"><label class="form-label fw-semibold" for="email">Email</label><input id="email" name="email" type="email" class="form-control" required autocomplete="email" placeholder="you@example.com"></div>
        <div class="mb-4"><label class="form-label fw-semibold" for="password">Mật khẩu</label><input id="password" name="password" type="password" class="form-control" required autocomplete="current-password" placeholder="Nhập mật khẩu"></div>
        <button id="submit" class="btn btn-primary w-100 py-2" type="submit">Đăng nhập</button>
      </form>
      <p class="text-center text-muted mt-4 mb-0">Chưa có tài khoản? <a class="fw-semibold" id="register-link" href="/static/register.html">Đăng ký ngay</a></p>
    </div></div>
  </div></div></main>
</div><script src="/static/js/auth.js?v=20260812-10"></script><script>
  const form=document.getElementById('login-form'), notice=document.getElementById('notice'), button=document.getElementById('submit');
  const next=new URLSearchParams(location.search).get('next');
  const safeNext=next && next.startsWith('/') && !next.startsWith('//') ? next : '/';
  document.getElementById('register-link').href='/static/register.html?next='+encodeURIComponent(safeNext);
  function show(message, success){notice.textContent=message;notice.className=`alert ${success?'alert-success':'alert-danger'}`}
  form.addEventListener('submit',async event=>{event.preventDefault();if(!form.checkValidity()){form.classList.add('was-validated');return}button.disabled=true;try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const result=await response.json();if(!response.ok){const detail=Array.isArray(result.detail)?result.detail.map(item=>item.msg).join(' '):result.detail;throw new Error(detail||'Không thể đăng nhập.')}localStorage.setItem('job_portal_token',result.access_token);localStorage.setItem('job_portal_user',JSON.stringify(result));const destination=result.role==='admin'?'/static/admin.html':(result.role==='partner'?'/static/hr_insider.html':(next?safeNext:'/'));show('Đăng nhập thành công. Đang chuyển trang…',true);setTimeout(()=>location.assign(destination),500)}catch(error){show(error.message,false);button.disabled=false}});
</script></body></html>
