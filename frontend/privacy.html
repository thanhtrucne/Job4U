<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quyền riêng tư — Job4U</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5" style="max-width:820px"><div class="d-flex justify-content-between align-items-center mb-3"><div><h1 class="h3 mb-1">Quyền riêng tư của tôi</h1><p class="text-muted mb-0">Chọn từng mục đích xử lý dữ liệu mà bạn đồng ý.</p></div><a href="/" class="btn btn-outline-secondary">Trang chủ</a></div><div id="notice" class="alert alert-info">Đang tải lựa chọn quyền riêng tư…</div><div id="items"></div><div class="d-flex flex-wrap gap-2 mt-3"><a id="continue" class="btn btn-primary d-none" href="/static/cv_match.html">Tiếp tục tạo hồ sơ</a><button class="btn btn-outline-danger" id="erase" type="button">Yêu cầu xóa dữ liệu cá nhân</button></div></main><script src="/static/js/auth.js?v=20260812-2"></script><script>
const token=Auth.getToken(),items=document.getElementById('items'),notice=document.getElementById('notice'),continueButton=document.getElementById('continue');
const next=new URLSearchParams(location.search).get('next');const safeNext=next&&next.startsWith('/')&&!next.startsWith('//')?next:'/static/cv_match.html';continueButton.href=safeNext;
const purposes={create_profile:'Tạo và lưu hồ sơ việc làm số',job_recommend:'Đề xuất việc làm phù hợp',reuse_documents:'Lưu giấy tờ đã xác minh để tái sử dụng',share_with_company:'Chia sẻ hồ sơ cho công ty khi bạn nộp việc'};
const headers={'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};
function show(text,type='info'){notice.textContent=text;notice.className='alert alert-'+type}
async function load(){if(!token){show('Bạn cần đăng nhập để quản lý quyền riêng tư.','warning');items.innerHTML='<a class="btn btn-primary" href="/static/login.html?next=%2Fstatic%2Fprivacy.html">Đăng nhập</a>';return}const response=await fetch('/api/privacy/consents',{headers:{Authorization:'Bearer '+token}});const rows=await response.json();if(!response.ok){show(rows.detail||'Không thể tải dữ liệu.','danger');return}items.innerHTML=Object.entries(purposes).map(([purpose,label])=>{const item=rows.find(row=>row.purpose===purpose),enabled=item&&item.granted_at&&!item.revoked_at;return `<label class="form-check border bg-white rounded p-3 mb-2 d-block"><input class="form-check-input me-2" type="checkbox" data-purpose="${purpose}" ${enabled?'checked':''}><span class="form-check-label fw-semibold">${label}</span></label>`}).join('');items.querySelectorAll('input').forEach(input=>input.addEventListener('change',()=>save(input)));updateContinue()}
async function save(input){input.disabled=true;const response=await fetch('/api/privacy/consents',{method:'PUT',headers,body:JSON.stringify({purpose:input.dataset.purpose,granted:input.checked,consent_text_version:'2026.2'})});const data=await response.json();if(!response.ok){input.checked=!input.checked;show(data.detail||'Không thể cập nhật lựa chọn.','danger')}else{show('Đã cập nhật lựa chọn quyền riêng tư.','success')}input.disabled=false;updateContinue()}
function updateContinue(){const create=items.querySelector('[data-purpose="create_profile"]')?.checked,recommend=items.querySelector('[data-purpose="job_recommend"]')?.checked;continueButton.classList.toggle('d-none',!(create&&recommend))}
document.getElementById('erase').addEventListener('click',async()=>{if(!token||!confirm('Xóa hồ sơ số, giấy tờ và vô hiệu hóa tài khoản?'))return;const response=await fetch('/api/privacy/my-data',{method:'DELETE',headers:{Authorization:'Bearer '+token}});const data=await response.json();show(data.message||data.detail||'Không thể xử lý yêu cầu.',response.ok?'success':'danger');if(response.ok)setTimeout(Auth.logout,800)});load();
</script></body></html>
