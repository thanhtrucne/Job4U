<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký doanh nghiệp | Job4U</title><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Inter:wght@700;800&display=swap" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet"><link href="/static/css/bootstrap.min.css" rel="stylesheet"><link href="/static/css/style_jobtop.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5" style="max-width:800px"><a class="text-decoration-none text-primary fw-bold" href="/"><i class="fa fa-briefcase me-2"></i>Job4U</a><div class="card border-0 shadow-sm mt-3"><div class="card-body p-4 p-md-5"><h1 class="h3">Đăng ký tài khoản doanh nghiệp</h1><p class="text-muted">Tạo doanh nghiệp, đăng tin tuyển dụng và quản lý hồ sơ ứng viên.</p><div id="notice" class="alert d-none" role="alert"></div><form id="company-register-form" class="row g-3" novalidate><div class="col-12"><h2 class="h6 border-bottom pb-2">Thông tin doanh nghiệp</h2></div><div class="col-md-6"><label class="form-label" for="company_name">Tên doanh nghiệp</label><input id="company_name" name="company_name" class="form-control" required></div><div class="col-md-6"><label class="form-label" for="company_industry">Ngành nghề</label><input id="company_industry" name="company_industry" class="form-control"></div><div class="col-md-6"><label class="form-label" for="company_location">Địa điểm</label><input id="company_location" name="company_location" class="form-control"></div><div class="col-md-6"><label class="form-label" for="company_website">Website</label><input id="company_website" name="company_website" type="url" class="form-control"></div><div class="col-12 mt-4"><h2 class="h6 border-bottom pb-2">Người đại diện đăng nhập</h2></div><div class="col-md-6"><label class="form-label" for="full_name">Họ và tên</label><input id="full_name" name="full_name" class="form-control" required></div><div class="col-md-6"><label class="form-label" for="phone_number">Số điện thoại</label><input id="phone_number" name="phone_number" type="tel" class="form-control" required></div><div class="col-md-6"><label class="form-label" for="email">Email đăng nhập</label><input id="email" name="email" type="email" class="form-control" required></div><div class="col-md-6"><label class="form-label" for="password">Mật khẩu</label><input id="password" name="password" type="password" minlength="8" class="form-control" required></div><div class="col-md-6"><label class="form-label" for="confirm_password">Xác nhận mật khẩu</label><input id="confirm_password" name="confirm_password" type="password" minlength="8" class="form-control" required></div><div class="col-12"><div class="form-check"><input id="data_policy_accepted" class="form-check-input" type="checkbox" required><label class="form-check-label" for="data_policy_accepted">Tôi đồng ý với <a href="/static/personal_data_policy.html" target="_blank">chính sách dữ liệu</a>.</label></div></div><div class="col-12 d-flex gap-2"><button id="submit" class="btn btn-primary px-4" type="submit">Tạo tài khoản doanh nghiệp</button><a class="btn btn-outline-secondary" href="/static/login.html">Đăng nhập</a></div></form></div></div></main><script>
const form=document.getElementById('company-register-form'),notice=document.getElementById('notice'),submit=document.getElementById('submit');function show(text,ok=false){notice.textContent=text;notice.className='alert '+(ok?'alert-success':'alert-danger')}form.addEventListener('submit',async event=>{event.preventDefault();if(!form.checkValidity()){form.classList.add('was-validated');return}submit.disabled=true;try{const payload=Object.fromEntries(new FormData(form));payload.data_policy_accepted=document.getElementById('data_policy_accepted').checked;const response=await fetch('/api/auth/register-company',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),data=await response.json();if(!response.ok)throw new Error(Array.isArray(data.detail)?data.detail.map(x=>x.msg).join(' '):data.detail||'Không thể đăng ký.');localStorage.setItem('job_portal_token',data.access_token);localStorage.setItem('job_portal_user',JSON.stringify(data));show('Đăng ký thành công. Đang mở HR Insider…',true);setTimeout(()=>location.assign('/static/hr_insider.html'),500)}catch(error){show(error.message);submit.disabled=false}});
</script></body></html>
