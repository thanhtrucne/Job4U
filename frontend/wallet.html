<!doctype html><html lang="vi"><meta charset="utf-8"><title>Ví giấy tờ số</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><body class="container py-5"><h1 class="h3">Ví giấy tờ số</h1><p>File được lưu ở MinIO, xét duyệt thủ công; hệ thống không đọc/OCR nội dung.</p><form id="upload" class="card card-body"><select name="doc_type" class="form-select mb-2"><option value="personal_profile">Lý lịch cá nhân</option><option value="job_application">Đơn xin việc</option><option value="health_certificate">Giấy khám sức khỏe</option><option value="qualification">Bằng cấp/chứng chỉ</option></select><input name="expiry_date" type="date" class="form-control mb-2"><input name="file" type="file" class="form-control mb-2" required><button class="btn btn-primary">Tải lên xét duyệt</button></form><div id="list" class="mt-4"></div><script src="/static/js/auth.js"></script><script>async function load(){let r=await fetch('/api/documents',{headers:{Authorization:'Bearer '+Auth.getToken()}}),a=await r.json();list.innerHTML=(a||[]).map(x=>`<div class="border p-2 mb-2">${x.doc_type} — <strong>${x.status}</strong>${x.expiry_date?' · hết hạn '+x.expiry_date:''}</div>`).join('')}upload.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/documents',{method:'POST',headers:{Authorization:'Bearer '+Auth.getToken()},body:new FormData(upload)});if(!r.ok)alert((await r.json()).detail);else{upload.reset();load()}};load()</script></body></html>
